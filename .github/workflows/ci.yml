name: Compliance as Code

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  controle-grc:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 03-compliance-as-code
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar verificação de controles (A.5.15, A.5.17, A.8.10, A.8.13)
        run: python check_controls.py --json relatorio_controles.json

      - name: Anexar relatório como artefato
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-controles
          path: 03-compliance-as-code/relatorio_controles.json
